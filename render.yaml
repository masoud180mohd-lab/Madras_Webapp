databases:
  - name: madrasa-db
    databaseName: madrasa_db
    user: madrasa_user
    plan: free
    region: oregon

# NOTE: The web service is intentionally NOT declared here any more.
# It is managed manually in the Render dashboard as `madrasa-webapp-oregon`
# (region: oregon, runtime: python, plan: free). The old Blueprint-managed
# service `madrasa-webapp` (Singapore) was deleted after the region cutover on
# 2026-10-20. Declaring it here again would let a Blueprint sync recreate a
# duplicate service, so Blueprint sync now owns only the database below.
#
# Manual web service settings (reference / disaster recovery):
#   buildCommand: ./build.sh
#   startCommand: gunicorn madrasa_sys.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --max-requests 1000 --max-requests-jitter 50
#   healthCheckPath: /
#   autoDeploy: true (branch: main)
#   env vars: PYTHON_VERSION=3.12.7, RENDER_DB_REGION=oregon,
#   DATABASE_URL=<external oregon-postgres.render.com URL>,
#   DJANGO_ENV=production, DJANGO_SETTINGS_MODULE=madrasa_sys.settings,
#   PYTHONUNBUFFERED=1, DJANGO_SECRET_KEY=<secret>,
#   DJANGO_ALLOWED_HOSTS=rasulillah.me,www.rasulillah.me,madrasa-webapp.onrender.com,.onrender.com,localhost,127.0.0.1,
#   DJANGO_CSRF_TRUSTED_ORIGINS=https://rasulillah.me,https://www.rasulillah.me,https://madrasa-webapp.onrender.com,https://*.onrender.com,
#   DJANGO_SECURE_SSL_REDIRECT=False,
#   CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET

