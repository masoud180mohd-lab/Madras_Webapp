name: Build Mobile APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Release APK (rasulillah.me)
        working-directory: apps/mobile
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=API_BASE_URL=https://rasulillah.me

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Madrasatul-Rasulillah-APK
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Al-Madrasatul Rasulillah Mobile v1.0.${{ github.run_number }}
          body: |
            Pakua (Download) **app-release.apk** hapa chini kwa ajili ya simu za Android.
            Imeunganishwa moja kwa moja na server ya **https://rasulillah.me**.
          files: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
