{% extends 'usimamizi/base.html' %}


{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'usimamizi/css/pages/orodha_madarasa.css' %}">
{% endblock %}

{% block maudhui %}
<div class="orodha_madarasa-inline-1">
    
    <h2 class="orodha_madarasa-inline-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        Madarasa
    </h2>

    <div class="orodha_madarasa-inline-3">
        {% for darasa in madarasa %}
        <a href="{% url 'wanafunzi_darasa' darasa.id %}" class="orodha_madarasa-inline-4">
            <div class="orodha_madarasa-inline-5">
                
                <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="orodha_madarasa-inline-6">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                
                <h2 class="orodha_madarasa-inline-7">{{ darasa.jina }}</h2>
            </div>
        </a>
        {% empty %}
        <div class="orodha_madarasa-inline-8">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="orodha_madarasa-inline-9">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <p class="orodha_madarasa-inline-10">Hakuna madarasa yaliyosajiliwa bado.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
