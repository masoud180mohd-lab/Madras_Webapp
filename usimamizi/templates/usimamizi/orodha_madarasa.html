{% extends 'usimamizi/base.html' %}

{% block maudhui %}
<div style="padding: 20px; max-width: 1000px; margin: auto;">
    
    <h2 style="color: #2E7D32; border-bottom: 2px solid #FFD700; padding-bottom: 10px; margin-bottom: 30px; display: flex; align-items: center; gap: 10px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        Madarasa
    </h2>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px;">
        {% for darasa in madarasa %}
        <a href="{% url 'wanafunzi_darasa' darasa.id %}" style="text-decoration: none;">
            <div style="background-color: white; padding: 40px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee; border-left: 6px solid #2E7D32; text-align: center; transition: all 0.3s ease; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px;" 
                 onmouseover="this.style.transform='translateY(-6px)'; this.style.boxShadow='0 12px 20px rgba(0,0,0,0.1)';" 
                 onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 10px rgba(0,0,0,0.05)';">
                
                <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.7;">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                
                <h2 style="color: #1b5e20; margin: 0; font-size: 22px; font-weight: bold;">{{ darasa.jina }}</h2>
            </div>
        </a>
        {% empty %}
        <div style="grid-column: 1 / -1; text-align: center; padding: 50px; color: #888; background: white; border-radius: 12px; border: 2px dashed #ddd;">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 15px;">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <p style="font-size: 18px;">Hakuna madarasa yaliyosajiliwa bado.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
