{% extends 'usimamizi/base.html' %}


{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'usimamizi/css/pages/hariri_mwanafunzi.css' %}">
{% endblock %}

{% block maudhui %}
<div class="hariri_mwanafunzi-inline-1">

    <div class="page-header">
        <div>
            <h1>Hariri Taarifa</h1>
            <p>Mwanafunzi: <b class="hariri_mwanafunzi-inline-2">{{ mwanafunzi.jina_kamili }}</b></p>
        </div>
        <a href="{% url 'orodha_wanafunzi' %}" class="btn-icon-back" title="Ghairi na Rudi">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>
    </div>

    <form method="POST" action="">
        {% csrf_token %}

        <div class="form-section">
            <h3 class="section-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Taarifa Binafsi
            </h3>
            
            <div class="input-group hariri_mwanafunzi-inline-3">
                <label>Jina Kamili</label>
                <input type="text" name="jina" value="{{ mwanafunzi.jina_kamili }}" required class="custom-input">
            </div>

            <div class="input-grid">
                <div class="input-group">
                    <label>Namba ya Usajili (Haihaririwi)</label>
                    <input type="text" name="namba_usajili" value="{{ mwanafunzi.namba_ya_usajili }}" readonly class="custom-input readonly-input" title="Namba hii inatengenezwa na mfumo automatiki na haiwezi kubadilishwa">
                </div>
                <div class="input-group">
                    <label>Juzuu Aliyohifadhi (Idadi)</label>
                    <input type="number" name="juzuu" value="{{ mwanafunzi.juzuu_aliyohifadhi }}" required class="custom-input">
                </div>
            </div>

            <div class="input-grid">
                <div class="input-group">
                    <label>Tarehe ya Kuzaliwa</label>
                    <input type="date" name="tarehe_kuzaliwa" value="{{ mwanafunzi.tarehe_ya_kuzaliwa|date:'Y-m-d' }}" class="custom-input">
                </div>
                <div class="input-group">
                    <label>Mahala Anapoishi (Mtaa)</label>
                    <input type="text" name="mahala" value="{{ mwanafunzi.mahala_anapoishi|default:'' }}" class="custom-input">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3 class="section-title hariri_mwanafunzi-inline-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                Mawasiliano ya Mzazi/Mlezi
            </h3>

            <div class="input-grid">
                <div class="input-group">
                    <label>Jina la Mzazi / Mlezi</label>
                    <input type="text" name="mzazi" value="{{ mwanafunzi.jina_la_mzazi|default:'' }}" class="custom-input">
                </div>
                <div class="input-group">
                    <label>Namba ya Simu</label>
                    <input type="text" name="simu" value="{{ mwanafunzi.namba_ya_simu_mzazi|default:'' }}" class="custom-input">
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <a href="{% url 'orodha_wanafunzi' %}" class="btn-cancel">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                Ghairi
            </a>
            <button type="submit" class="btn-submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                Hifadhi Mabadiliko
            </button>
        </div>

    </form>
</div>
{% endblock %}
