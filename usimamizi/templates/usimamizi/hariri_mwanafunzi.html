{% extends 'usimamizi/base.html' %}

{% block maudhui %}
<style>
    /* ----- PREMIUM MINIMALIST UI - HARIRI MWANAFUNZI ----- */
    :root {
        --primary: #2E7D32;
        --secondary: #0288D1;
        --warning: #f57c00;
        --danger: #d32f2f;
        
        --bg-body: #f4f7f6;
        --card-bg: #ffffff;
        --text-main: #2c3e50;
        --text-muted: #7f8c8d;
        --border-color: #e2e8f0;
        --table-header: #f8fafc;
        --input-bg: #ffffff;
    }

    body.dark-mode {
        --bg-body: #121212;
        --card-bg: #1e1e1e;
        --text-main: #e0e0e0;
        --text-muted: #a0aec0;
        --border-color: #333333;
        --table-header: #222222;
        --input-bg: #2c2c2c;
    }

    /* Kichwa cha Ukurasa */
    .page-header {
        background-color: var(--card-bg); padding: 25px 30px; border-radius: 12px; border: 1px solid var(--border-color); border-left: 6px solid var(--primary); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
    }
    .page-header h1 { margin: 0 0 5px 0; color: var(--text-main); font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .page-header p { margin: 0; color: var(--text-muted); font-size: 14px; }
    
    .btn-icon-back {
        display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border-color); color: var(--text-main); transition: 0.2s; text-decoration: none;
    }
    .btn-icon-back:hover { background-color: var(--table-header); border-color: var(--text-muted); }

    /* Kadi za Fomu */
    .form-section {
        background-color: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.01); margin-bottom: 25px;
    }
    .section-title {
        color: var(--text-main); font-size: 16px; margin: 0 0 20px 0; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* Inputs Styling */
    .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .input-group label { display: block; font-weight: 600; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    
    .custom-input {
        width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main); font-size: 14px; outline: none; transition: 0.2s; box-sizing: border-box;
    }
    .custom-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1); }
    
    /* Input Maalum isiyohaririwa (Readonly) */
    .readonly-input {
        background-color: var(--table-header); color: var(--text-muted); cursor: not-allowed; opacity: 0.8; border-style: dashed;
    }
    .readonly-input:focus { border-color: var(--border-color); box-shadow: none; }

    /* Vitufe vya Chini */
    .action-buttons {
        display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px;
    }
    
    .btn-cancel {
        flex: 1; background-color: transparent; color: var(--text-main); border: 1px solid var(--border-color); padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 150px;
    }
    .btn-cancel:hover { background-color: var(--table-header); border-color: var(--text-muted); }

    .btn-submit {
        flex: 2; background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 200px; box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
    }
    .btn-submit:hover { background-color: #1b5e20; transform: translateY(-2px); }

</style>

<div style="max-width: 800px; margin: auto; padding: 20px;">

    <div class="page-header">
        <div>
            <h1>Hariri Taarifa</h1>
            <p>Mwanafunzi: <b style="color: var(--secondary);">{{ mwanafunzi.jina_kamili }}</b></p>
        </div>
        <a href="{% url 'orodha_wanafunzi' %}" class="btn-icon-back" title="Ghairi na Rudi">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </a>
    </div>

    <form method="POST" action="">
        {% csrf_token %}

        <div class="form-section">
            <h3 class="section-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Taarifa Binafsi
            </h3>
            
            <div class="input-group" style="margin-bottom: 20px;">
                <label>Jina Kamili</label>
                <input type="text" name="jina" value="{{ mwanafunzi.jina_kamili }}" required class="custom-input">
            </div>

            <div class="input-grid">
                <div class="input-group">
                    <label>Namba ya Usajili (Haihaririwi)</label>
                    <input type="text" name="namba_usajili" value="{{ mwanafunzi.namba_ya_usajili }}" readonly class="custom-input readonly-input" title="Namba hii inatengenezwa na mfumo automatiki na haiwezi kubadilishwa">
                </div>
                <div class="input-group">
                    <label>Juzuu Aliyohifadhi (Idadi)</label>
                    <input type="number" name="juzuu" value="{{ mwanafunzi.juzuu_aliyohifadhi }}" required class="custom-input">
                </div>
            </div>

            <div class="input-grid">
                <div class="input-group">
                    <label>Tarehe ya Kuzaliwa</label>
                    <input type="date" name="tarehe_kuzaliwa" value="{{ mwanafunzi.tarehe_ya_kuzaliwa|date:'Y-m-d' }}" class="custom-input">
                </div>
                <div class="input-group">
                    <label>Mahala Anapoishi (Mtaa)</label>
                    <input type="text" name="mahala" value="{{ mwanafunzi.mahala_anapoishi|default:'' }}" class="custom-input">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3 class="section-title" style="color: var(--warning);">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                Mawasiliano ya Mzazi/Mlezi
            </h3>

            <div class="input-grid">
                <div class="input-group">
                    <label>Jina la Mzazi / Mlezi</label>
                    <input type="text" name="mzazi" value="{{ mwanafunzi.jina_la_mzazi|default:'' }}" class="custom-input">
                </div>
                <div class="input-group">
                    <label>Namba ya Simu</label>
                    <input type="text" name="simu" value="{{ mwanafunzi.namba_ya_simu_mzazi|default:'' }}" class="custom-input">
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <a href="{% url 'orodha_wanafunzi' %}" class="btn-cancel">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                Ghairi
            </a>
            <button type="submit" class="btn-submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                Hifadhi Mabadiliko
            </button>
        </div>

    </form>
</div>
{% endblock %}
