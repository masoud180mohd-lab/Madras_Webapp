{% extends 'usimamizi/base.html' %}


{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'usimamizi/css/pages/fomu_somo.css' %}">
{% endblock %}

{% block maudhui %}
<div class="fomu_somo-inline-1">
    
    <div class="form-card {% if aina == 'Nyenzo' %}form-card-nyenzo{% else %}form-card-mtihani{% endif %}">
        
        <div class="form-header">
            <h2>
                {% if aina == 'Nyenzo' %}
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Pakia Nyenzo Mpya
                {% else %}
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Ongeza Mtihani
                {% endif %}
            </h2>
            <p>Somo: <b class="fomu_somo-inline-2">{{ somo.jina }}</b></p>
        </div>
        
        <form method="POST" enctype="multipart/form-data" class="styled-form">
            {% csrf_token %}
            
            {{ form.as_p }}

            <button type="submit" class="btn-submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                Hifadhi {{ aina }}
            </button>
            
            <a href="{% url 'somo_detail' somo.id %}" class="btn-cancel">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                Ghairi na Rudi Nyuma
            </a>
        </form>

    </div>
</div>
{% endblock %}
