{% extends 'usimamizi/base.html' %}

{% block maudhui %}
<div style="max-width: 500px; margin: auto; padding: 20px;">
    <div style="background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 5px solid #2E7D32;">
        <h2 style="color: #2E7D32; text-align: center; margin-bottom: 5px;">Kumbukumbu ya Sabaq</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;"><b>Mwanafunzi:</b> {{ mwanafunzi.jina_kamili }}</p>
        
        <form method="POST">
            {% csrf_token %}
            
            <div style="background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                <label style="color: #1b5e20; font-weight: bold;">📖 Amesoma Kuanzia:</label>
                {{ form.sura_kuanzia }}
                {{ form.aya_kuanzia }}
            </div>

            <div style="background: #f1f8e9; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                <label style="color: #1b5e20; font-weight: bold;">🏁 Mpaka:</label>
                {{ form.sura_kuishia }}
                {{ form.aya_kuishia }}
            </div>

            <div style="margin-bottom: 20px;">
                <label style="font-weight: bold;">📝 Maoni / Mapendekezo:</label>
                {{ form.maoni }}
            </div>

            <button type="submit" style="width: 100%; background: #2E7D32; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;">
                ✅ Hifadhi Maendeleo ya Leo
            </button>
            <a href="{% url 'orodha_wanafunzi' %}" style="display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none;">Hairisha</a>
        </form>
    </div>
</div>
{% endblock %}
