{% load static %}
<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingia - Al-Madrasatul Rasulillah</title>
    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (theme) document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="{% static 'usimamizi/css/base.css' %}?v=20260706a">
    <link rel="stylesheet" href="{% static 'usimamizi/css/pages/ingia.css' %}?v=20260706a">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <img src="{% static 'usimamizi/images/logo.png' %}" alt="Logo ya Madrasa" class="login-logo">
        
        <h2 class="login-title">Karibu Ndani</h2>
        <p class="login-subtitle">Weka taarifa zako za kiutawala kuingia kwenye mfumo.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-error">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ingia-inline-1"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>Jina la Kuingilia (Username)</label>
                <input type="text" name="username" required placeholder="Mfano: Ustadh_Mwalimu">
            </div>
            <div class="input-group">
                <label>Neno la Siri (Password)</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-login">
                Ingia Kwenye Mfumo
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
            </button>
        </form>
    </div>
    
    <div class="footer-text ingia-inline-2">
        &copy; 2024 Al-Madrasatul Rasulillah. Haki Zote Zimehifadhiwa.
    </div>
</div>

</body>
</html>
